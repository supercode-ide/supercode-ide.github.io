<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090A0F">
  <meta name="robots" content="noindex, follow">
  <title>404 — Page Not Found | SuperCode IDE</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .sc-404 { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
    .sc-404__card { max-width: 520px; width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 18px; padding: 34px 28px; text-align: center; box-shadow: 0 28px 64px rgba(0,0,0,0.72); }
    .sc-404__code { font-family: var(--font-mono); font-size: 3.2rem; font-weight: 700; color: var(--gold); line-height: 1; margin-bottom: 12px; }
    .sc-404__card h1 { font-size: 1.35rem; margin-bottom: 10px; }
    .sc-404__card p { color: var(--fg-2); font-size: 0.94rem; margin-bottom: 24px; }
    .sc-404__actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  </style>
</head>
<body>
  <main class="sc-404">
    <div class="sc-404__card">
      <div class="sc-404__code">404</div>
      <h1>Page Not Found</h1>
      <p>The SuperCode IDE page you requested could not be found. Return to the official hub or install SuperCode IDE on Google Play.</p>
      <div class="sc-404__actions">
        <a href="/" class="btn btn--gold">SuperCode IDE Home</a>
        <a href="https://play.google.com/store/apps/details?id=com.phoenixglobal.supercodeeditor" target="_blank" rel="noopener" class="btn btn--ghost">Google Play &#8599;</a>
      </div>
    </div>
  </main>
</body>
</html>
