  <style>
    :root {
      --bg: #090A0F; --card: #151821; --line-strong: rgba(255, 255, 255, 0.14);
      --fg: #F5F7FA; --fg-2: #9BA3B4; --gold: #F5C451;
      --gold-border: rgba(255, 215, 0, 0.32); --gold-border-hover: rgba(255, 215, 0, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;

      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans Arabic", "Noto Sans Hebrew", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .launchpad {
      width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line-strong);
      border-radius: 18px; padding: 28px 24px 24px;
      box-shadow: 0 28px 64px -16px rgba(0, 0, 0, 0.80), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    .lp-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .badge {
      width: 44px; height: 44px; border-radius: 11px;
      background: linear-gradient(180deg, #1B1E29 0%, #11131A 100%);
      border: 1px solid rgba(255, 215, 0, 0.28); display: grid; place-items: center;
    }
    .badge svg { width: 26px; height: 26px; }
    .btn-home-icon {
      width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line-strong);
      color: var(--fg-2); text-decoration: none; transition: all 0.2s ease;
    }
    .btn-home-icon:hover { color: var(--gold); border-color: var(--gold-border); background: rgba(245, 196, 81, 0.08); }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.35; margin-bottom: 10px; }
    p { font-size: 0.92rem; color: var(--fg-2); line-height: 1.65; margin-bottom: 24px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn-gold {
      flex: 1 1 auto; height: 42px; padding: 0 18px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(180deg, #1A1D27 0%, #11131A 100%);
      border: 1px solid var(--gold-border); color: var(--fg); font-weight: 600; font-size: 0.875rem; text-decoration: none; white-space: nowrap;
    }
    .btn-gold:hover { border-color: var(--gold-border-hover); }
    .btn-ghost {
      flex: 1 1 auto; height: 42px; padding: 0 16px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line-strong);
      color: var(--fg-2); font-weight: 500; font-size: 0.875rem; text-decoration: none; white-space: nowrap;
    }
    .btn-ghost:hover { color: var(--fg); background: rgba(255, 255, 255, 0.06); }
    .gp-prism { width: 15px; height: 15px; flex: none; }
